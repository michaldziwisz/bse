name: BSE
options:
  bundleIdPrefix: eu.blueseaeye
  developmentLanguage: pl
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: BSE
    DEVELOPMENT_LANGUAGE: pl
    PRODUCT_BUNDLE_IDENTIFIER: eu.blueseaeye.bse
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 9
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_ASSET_PATHS: ""
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: BSE/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: BSE/BSE.entitlements
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BSE:
    type: application
    platform: iOS
    sources:
      - path: BSE
    resources:
      - path: BSE/Resources
    settings:
      base:
        PRODUCT_NAME: BSE
    scheme:
      gatherCoverageData: false
