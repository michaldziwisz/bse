; BlueSeaEye — własny mock firmware (odtworzony kontrakt, nie kod autora).
; Cel: mock generujący kursy ORAZ wychylenie steru (rsa), ze stanowym
; przełącznikiem /api/helm?disableRudder=true|false (zapamiętywanym w NVS).
; Ten sam stack co oryginał: Arduino-ESP32 + ESPAsyncWebServer.

[env:esp32devc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
